[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okul-zili"
version = "0.8.0"
description = "Tamamen çevrimdışı çalışan Türkçe okul zili sistemi"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Okul Zili Projesi"}]
license = {file = "LICENSE"}
dependencies = [
  "Pillow>=10,<13",
  "six>=1.16,<2",
  "miniaudio>=1.71,<2",
  # vendor/customtkinter ile birebir aynı sürüm: uygulama CTk iç bayraklarına
  # dayanır, Windows (pip) ve Linux (vendor) paketleri ayrışmamalı (8.3).
  "customtkinter==5.2.2",
  # Windows'ta zoneinfo saat dilimi verisini bu paketten alır; olmadan ön
  # kontrol "Saat dilimi verisi bulunamadı" kritik uyarısı verir (D11).
  "tzdata>=2024.1",
]

[project.scripts]
okul-zili = "okul_zili.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okul_zili = ["assets/*.png", "assets/sounds/*.wav"]

[tool.setuptools.data-files]
"share/okul-zili/licenses" = ["THIRD_PARTY_LICENSES/*"]
"share/doc/okul-zili" = ["LICENSE", "NOTICE"]
