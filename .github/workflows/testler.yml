# O13: Her PR ve main push'unda test paketi iki hedef platformda koşar;
# PR'lar test güvencesi olmadan birleşmez.
name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testler:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: python -m pip install "Pillow>=10,<13" "six>=1.16,<2" "miniaudio>=1.71,<2" "customtkinter>=5.2.2,<6"
      - name: Testleri koş
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
