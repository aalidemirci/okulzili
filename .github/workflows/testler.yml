# O13: Her PR ve main push'unda test paketi iki hedef platformda koşar;
# PR'lar test güvencesi olmadan birleşmez.
# 8.5: Linux hedefleri Pardus 23 (Python 3.11) ve Ubuntu 22.04 (Python 3.10)
# olduğundan matris bu sürümleri de kapsar; Windows paketi 3.12 ile üretilir.
name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testler:
    name: Testler (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Bağımlılıkları kur (tek kaynak: pyproject.toml)
        run: python -m pip install -e .
      - name: Testleri koş
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
